<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Detalle del producto de Hermanos Jota." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Playfair+Display:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0&icon_names=shopping_cart"
    />
    <link rel="stylesheet" href="../css/style.css" />
    <link rel="stylesheet" href="catalogo.css" />
    <script src="productos.js" defer></script>
    <script src="../js/carrito.js" defer></script>
    <title>Detalle del producto | Hermanos Jota</title>
  </head>
  <body>
    <header>
      <div class="header-inner">
        <a
          href="../index.html"
          class="logo-link"
          aria-label="Hermanos Jota — Inicio"
        >
          <img
            src="../imagenes/logo.svg"
            alt="Logotipo de Hermanos Jota"
            class="logo"
            width="120"
            height="120"
          />
          <span class="logo-wordmark">Hermanos Jota</span>
        </a>

        <nav class="main-nav" aria-label="Navegación principal">
          <ul>
            <li><a href="../index.html">Inicio</a></li>
            <li><a href="productos.html">Productos</a></li>
            <li><a href="../contacto.html">Contacto</a></li>
          </ul>
        </nav>

        <button type="button" class="carrito-header" aria-label="Carrito de compras">
          <span class="material-symbols-outlined" aria-hidden="true">shopping_cart</span>
        </button>
      </div>
    </header>

    <main class="product-detail-page">
      <nav class="detail-breadcrumb" aria-label="Breadcrumb">
        <a href="../index.html">Inicio</a>
        <span>/</span>
        <a href="productos.html">Catálogo</a>
        <span>/</span>
        <span>Detalle</span>
      </nav>

      <article class="detail-card" aria-live="polite">
        <div class="detail-image-wrap">
          <img id="detail-image" src="" alt="" />
        </div>

        <div class="detail-content">
          <p id="detail-category" class="detail-category"></p>
          <h1 id="detail-name"></h1>
          <p id="detail-price" class="detail-price"></p>
          <p id="detail-description" class="detail-description"></p>

          <div class="detail-badges">
            <span class="product-badge">Hecho a mano</span>
            <span class="product-badge badge-sage">Materiales nobles</span>
          </div>

          <div class="detail-actions">
            <a href="productos.html" class="btn-secondary"
              >Volver al catálogo</a
            >
            <button type="button" class="btn-primary">Añadir al carrito</button>
          </div>
        </div>
      </article>
    </main>
  </body>
</html>
